[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oratlas-verify"
version = "0.1.1"
description = "External agentic scientific-verification engine for ORAtlas"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "dhuzard" }]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "matplotlib>=3.10.5,<3.11",
  "numpy>=2.2.6,<3",
  "pandas>=2.3.2,<3",
  "pydantic>=2.11.7,<3",
  "scipy>=1.15.3,<2",
  "statsmodels>=0.14.5,<0.15",
]

[project.optional-dependencies]
images = ["Pillow>=11.3,<12"]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<0.23",
  "ruff>=0.12.10,<0.13",
]

[project.scripts]
oratlas-verify = "oratlas_verify.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oratlas_verify"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oratlas_verify"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
